name: Release Mac app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[all,window]" pyinstaller pillow
      - run: packaging/macos/build_app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "packaging/macos/dist/Protocol-Toolkit-macOS.zip" \
            --title "Protocol Toolkit $GITHUB_REF_NAME" --generate-notes \
            --notes "Unsigned build: on first launch, right-click the app and choose Open."
