name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[all,dev]"
      - run: python -m pyflakes protocol_toolkit tests scripts
      - name: Tests (offline)
        run: python -m pytest -m "not network" -q

  network:
    name: Live network tests
    runs-on: ubuntu-latest
    continue-on-error: true  # depends on third-party servers being reachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all,dev]"
      - run: python -m pytest -m network -q

  wireshark:
    name: Exports decrypt in Wireshark (tshark)
    runs-on: ubuntu-latest
    continue-on-error: true  # makes real HTTPS, QUIC and DNS requests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all]"
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark
      - run: python scripts/verify_pcap_with_tshark.py

  web:
    name: UI type-check, build and end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "..[all]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
